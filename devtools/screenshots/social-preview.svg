<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="10" height="640" fill="url(#accent)"/>
  <g font-family="JetBrains Mono, DejaVu Sans Mono, monospace">
    <text x="80" y="250" font-size="72" font-weight="700" fill="url(#accent)">tmux-sidepanel</text>
    <text x="84" y="324" font-size="30" fill="#a9b1d6">A side panel for tmux:</text>
    <text x="84" y="366" font-size="30" fill="#a9b1d6">panes, coding agents,</text>
    <text x="84" y="408" font-size="30" fill="#a9b1d6">services and containers</text>
    <text x="84" y="450" font-size="30" fill="#a9b1d6">at a glance.</text>
    <text x="84" y="560" font-size="20" fill="#565f89">TPM plugin  |  Python  |  Claude Code hooks</text>
  </g>
  <g transform="translate(800,200) scale(1.1)">
    <rect width="372" height="224" rx="10" fill="#16161e" stroke="#3b4261" stroke-width="2"/>
    <rect width="372" height="30" rx="10" fill="#292e42"/>
    <rect y="14" width="372" height="16" fill="#292e42"/>
    <circle cx="20" cy="15" r="5" fill="#f7768e"/><circle cx="38" cy="15" r="5" fill="#e0af68"/><circle cx="56" cy="15" r="5" fill="#9ece6a"/>
    <g font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="16">
      <text x="20" y="56" font-weight="700" fill="#c0caf5">PANES</text>
      <rect x="12" y="64" width="190" height="24" fill="#e0af68"/>
      <text x="20" y="82" font-weight="700" fill="#1a1b26">~ add export</text>
      <text x="20" y="108" fill="#f7768e">! fix retry</text>
      <text x="20" y="134" fill="#9ece6a">+ update changelog</text>
      <text x="20" y="160" font-weight="700" fill="#c0caf5">SERVICES</text>
      <text x="20" y="186" fill="#e0af68">T pytest -q tests/</text>
      <text x="20" y="212" fill="#7dcfff">S npm run dev</text>
    </g>
    <line x1="214" y1="30" x2="214" y2="224" stroke="#3b4261" stroke-width="2"/>
    <g fill="#565f89" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="14">
      <text x="232" y="60">Reading files</text>
      <text x="232" y="84">Editing code</text>
      <text x="232" y="108">Running tests</text>
    </g>
  </g>
</svg>
