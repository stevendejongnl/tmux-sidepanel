[project]
name = "tmux-sidepanel"
version = "0.0.0"
description = "A per-window side panel for tmux: panes, agents, services and zombies, with actions."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "complexipy>=8.0.1",
    "pytest>=8",
    "python-semantic-release>=10.7.0",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
# The tmux client runs a program with a list of arguments, never through a shell.
"src/tmux_sidepanel/tmux_client.py" = ["S603", "S607"]
# The command runner starts programs from a list of arguments, never through a shell.
"src/tmux_sidepanel/command_runner.py" = ["S603", "S607"]
# Docker is started from a list of arguments with names that were checked, never through a shell.
"src/tmux_sidepanel/docker_actions.py" = ["S603"]

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false
build_command = ""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.remote]
type = "github"

[tool.complexipy]
max-complexity-allowed = 5
